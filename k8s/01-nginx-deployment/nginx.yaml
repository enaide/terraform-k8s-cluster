# ─────────────────────────────────────────────────────────────────────────────
# Prueba 1 — Deployment: nginx con 3 réplicas + Service ClusterIP
#
#   kubectl --context dev-k8s create namespace lab
#   kubectl --context dev-k8s apply -f k8s/01-nginx-deployment/nginx.yaml
#
# El namespace NO se define aquí a propósito: así `kubectl delete -f` de este
# archivo nunca puede borrar el namespace "lab" (donde también vive MongoDB).
#
# Único manifiesto propio del laboratorio: el resto se instala con Helm y
# custom-values.yaml. Ver docs/lab-k8s-mongodb-helm.md, paso 2.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lab
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: lab
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
